services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: website_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: website_intel
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://website_intel:${POSTGRES_PASSWORD}@db:5432/website_intel
      SESSION_SECRET: ${SESSION_SECRET}
      ORIGIN: https://monitor.andybz.com
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      # Only reachable on localhost - nginx (already configured on the host)
      # proxies public HTTPS traffic to this port.
      - '127.0.0.1:3000:3000'

volumes:
  db-data:
