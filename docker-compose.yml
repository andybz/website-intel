services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: website_intel
      POSTGRES_PASSWORD: website_intel_dev
      POSTGRES_DB: website_intel
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
